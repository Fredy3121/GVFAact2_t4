<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Lista</title>
    <style>
        body { font-family: sans-serif; margin: 30px; }
        table { border-collapse: collapse; width: 100%; margin-top: 15px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background: #f4f4f4; }
        .badge { background: #e0f2fe; padding: 4px 8px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1 th:text="${titulo}"></h1>
    <p>Desarrollado por: <strong th:text="${autor}"></strong></p>
    
    <div>
        <a th:href="@{/productos/nuevo}">+ Registrar Nuevo Producto</a> | 
        <a th:href="@{/productos/lista}">Ver Todos</a> | 
        <a th:href="@{/productos/lista(categoria='Papeleria')}">Filtrar Papelería</a> | 
        <a th:href="@{/productos/lista(categoria='Electronica')}">Filtrar Electrónica</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Categoría</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="prod : ${productos}">
                <td th:text="${prod.id}"></td>
                <td th:text="${prod.nombre}"></td>
                <td th:text="'$' + ${prod.precio}"></td>
                <td><span class="badge" th:text="${prod.categoria}"></span></td>
                <td><a th:href="@{/productos/detalle/{id}(id=${prod.id})}">Ver Detalle</a></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
