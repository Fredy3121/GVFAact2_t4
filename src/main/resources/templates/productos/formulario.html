<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Formulario</title>
    <style>
        body { font-family: sans-serif; margin: 30px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; }
        input, select { padding: 6px; width: 250px; }
    </style>
</head>
<body>
    <h1 th:text="${titulo}"></h1>
    <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" th:field="*{nombre}" required />
        </div>
        <div class="form-group">
            <label for="precio">Precio:</label>
            <input type="number" step="0.5" id="precio" th:field="*{precio}" required />
        </div>
        <div class="form-group">
            <label for="categoria">Categoría:</label>
            <input type="text" id="categoria" th:field="*{categoria}" required />
        </div>
        <button type="submit">Guardar Producto</button>
    </form>
    <p><a th:href="@{/productos/lista}">Volver</a></p>
</body>
</html>
